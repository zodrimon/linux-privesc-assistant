[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "privesc-assistant"
version = "0.1.0"
description = "Linux Privilege Escalation Assistant"
readme = "README.md"
requires-python = ">=3.8"
authors = [
    {name = "zodrimon", email = "zodrimon@example.com"}
]
dependencies = [
    # Optional dependency for colored terminal output.
    # We keep standard-library-first approach by making it optional,
    # but include it in standard installation for better UX.
    "rich>=13.0.0"
]

[project.optional-dependencies]
dev = [
    "mypy>=1.0.0"
]

[project.scripts]
privesc-assistant = "privesc_assistant.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.mypy]
ignore_missing_imports = true
strict = false
