[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "linux-privesc-assistant"
version = "0.1.0"
description = "A CLI tool that automatically enumerates a Linux system for privilege escalation vectors."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Rimon"}
]
dependencies = [
    "click",
    "rich",
    "pyyaml"
]

[project.scripts]
privesc-assistant = "privesc_assistant.cli:main"
